<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MysteryMind - 推理助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #0f172a; /* Slate 900 */
        color: #e2e8f0; /* Slate 200 */
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        width: 100vw;
        min-height: 100vh;
      }
      /* Error Banner Style */
      #startup-error {
        display: none;
        position: fixed;
        top: 20px; left: 20px; right: 20px;
        padding: 20px;
        background-color: #7f1d1d;
        color: #fca5a5;
        border: 1px solid #ef4444;
        border-radius: 8px;
        z-index: 9999;
        font-family: monospace;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "d3": "https://esm.sh/d3@^7.9.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="startup-error">
        <h3 style="margin-top:0; font-weight:bold; color: white;">应用启动失败</h3>
        <p id="error-message"></p>
        <p style="margin-top: 10px; font-size: 0.9em; color: #e2e8f0; border-top: 1px solid #991b1b; padding-top: 10px;">
            请尝试刷新页面。如果问题持续存在，请检查浏览器控制台 (F12) 获取详细错误信息。
        </p>
    </div>

    <div id="root"></div>

    <!-- Script Error Handler -->
    <script>
        window.addEventListener('error', function(e) {
            var banner = document.getElementById('startup-error');
            var msg = document.getElementById('error-message');
            if (banner && msg) {
                // If React root is empty, assume critical failure
                if (!document.getElementById('root').hasChildNodes()) {
                    banner.style.display = 'block';
                    msg.innerText = "Error: " + e.message + "\n(File: " + e.filename + ")";
                }
            }
        });
    </script>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
